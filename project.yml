# XcodeGen project spec — generates HoustonBBQGuide.xcodeproj from this YAML.
# Run `xcodegen generate` on the Mac to (re)create the project.
# Keeps the .pbxproj out of the way so the project can be edited on Windows.

name: HoustonBBQGuide

options:
  bundleIdPrefix: com.compofelice
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ALWAYS_SEARCH_USER_PATHS: NO

# Firestore receives suggested joints. Nothing else in the app talks to a
# network service it owns - the guide data itself is a static JSON file on
# GitHub Pages - so this is the only dependency here.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  HoustonBBQGuide:
    type: application
    platform: iOS
    dependencies:
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseFirestore
    sources:
      - path: HoustonBBQGuide
        excludes:
          - "Info.plist"
    info:
      path: HoustonBBQGuide/Info.plist
      properties:
        CFBundleDisplayName: HOU BBQ
        CFBundleShortVersionString: "1.0"
        # Fallback only. Generate via ./gen.sh, which stamps CFBundleVersion with
        # the git commit count (git rev-list --count HEAD) into the built Info.plist.
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon
        UILaunchScreen:
          UIColorName: ""
        NSLocationWhenInUseUsageDescription: Used to show barbecue joints near you and sort by distance.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
        ITSAppUsesNonExemptEncryption: false
    # App Attest backs Firebase App Check (enforced on Firestore), so the suggest-a-joint
    # form needs it on every signed Release build. TestFlight/App Store builds use the
    # production environment regardless; Debug builds use the App Check debug provider.
    # The App ID must have the "App Attest" capability ticked in the developer portal
    # (the ASC API can't set it), then re-run ~/appstoreconnect/ci_signing.py houston-bbq-guide.
    entitlements:
      path: HoustonBBQGuide/HoustonBBQGuide.entitlements
      properties:
        com.apple.developer.devicecheck.appattest-environment: production
    settings:
      base:
        PRODUCT_NAME: HoustonBBQGuide
        PRODUCT_BUNDLE_IDENTIFIER: com.compofelice.HoustonBBQGuide
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7H5T5AR2X5
        # Empty on the Mac (automatic signing unchanged); scripts/ci/testflight-ci.sh passes
        # HOUBBQ_APP_PROFILE="Houston BBQ AppStore CI" for manual signing on the GitHub runner.
        PROVISIONING_PROFILE_SPECIFIER: "$(HOUBBQ_APP_PROFILE)"
