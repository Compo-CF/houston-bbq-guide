# XcodeGen project spec — generates HoustonBBQGuide.xcodeproj from this YAML.
# Run `xcodegen generate` on the Mac to (re)create the project.
# Keeps the .pbxproj out of the way so the project can be edited on Windows.

name: HoustonBBQGuide

options:
  bundleIdPrefix: com.compofelice
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  HoustonBBQGuide:
    type: application
    platform: iOS
    sources:
      - path: HoustonBBQGuide
        excludes:
          - "Info.plist"
    info:
      path: HoustonBBQGuide/Info.plist
      properties:
        CFBundleDisplayName: HOU BBQ
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
        CFBundleIconName: AppIcon
        UILaunchScreen:
          UIColorName: ""
        NSLocationWhenInUseUsageDescription: Used to show barbecue joints near you and sort by distance.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - armv7
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: HoustonBBQGuide
        PRODUCT_BUNDLE_IDENTIFIER: com.compofelice.HoustonBBQGuide
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7H5T5AR2X5
